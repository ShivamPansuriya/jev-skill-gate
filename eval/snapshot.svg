  <circle cx="56" cy="15" r="5" fill="#61c554"/>
  <text x="380" y="19" fill="#8b93a7" font-size="11" text-anchor="middle">jev-skill-gate</text>

  <text x="18" y="56" fill="#61c554">$</text>
