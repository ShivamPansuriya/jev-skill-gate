<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13">
  <title>jev-skill-gate preview — a Rust prompt selects Rust skills</title>
  <desc>Verbatim terminal output: a borrow-checker prompt ranks rust-build, rust-review, rust-patterns, rust-testing and rust-test as the top five of 217 installed skills, cutting the manifest from 12,750 to 3,185 tokens.</desc>

